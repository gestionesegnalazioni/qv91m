<style>html,body{margin:0;background:#080b12;color:#9aa4b2;font-family:Arial,sans-serif;height:100%}body{display:grid;place-items:center}.loading{text-align:center;font-weight:700;letter-spacing:.4px}</style>

<body>
<div class="loading">Caricamento…</div>
<script>
  const target = new URL('./', window.location.href);
  target.searchParams.set('aggiornamento', Date.now().toString());
  window.location.replace(target.href);
</script>
