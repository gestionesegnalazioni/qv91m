<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10264b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agenda Turni">
  <meta name="description" content="Prospetto cambi turno dal 15 settembre 2026 al 10 giugno 2027.">
  <title>Prospetto Cambi Turno</title>
  <link rel="icon" href="agenda-icon-nero.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="agenda-icon-nero.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=20260910-5">
</head>
<body>
  <header class="top-switcher">
    <nav class="view-tabs" aria-label="Sezioni del prospetto">
      <button class="view-tab" type="button" data-app-view="prospetto" aria-selected="false">Prospetto</button>
      <button class="view-tab is-active" type="button" data-app-view="agenda" aria-selected="true">Agenda</button>
    </nav>
    <div class="sync-bar" id="syncBar">
      <span class="sync-status" id="syncStatus">Verifica sincronizzazione…</span>
      <button class="sync-button" id="syncButton" type="button" hidden>Accedi e sincronizza</button>
    </div>
  </header>

  <main class="schedule-board">
    <section id="prospettoView" aria-label="Prospetto cambi turno" hidden>
      <p id="loadingStatus" class="loading-status">Caricamento del prospetto…</p>
      <div id="weeks" class="weeks"></div>
    </section>

    <section id="agendaView" class="agenda-view" aria-label="Agenda personale">
      <div class="agenda-toolbar">
        <button id="agendaPrevious" class="agenda-month-button" type="button" aria-label="Mese precedente">‹</button>
        <div>
          <p class="agenda-kicker">La mia agenda</p>
          <h1 id="agendaMonthTitle">Agenda</h1>
        </div>
        <button id="agendaNext" class="agenda-month-button" type="button" aria-label="Mese successivo">›</button>
      </div>
      <p class="agenda-legend"><span class="legend-dot legend-dot--turn"></span>Turno previsto <span class="legend-dot legend-dot--change"></span>Cambio <span class="legend-dot legend-dot--vacation"></span>Ferie <span class="legend-dot legend-dot--rest"></span>Riposo <span class="legend-dot legend-dot--sunday"></span>Domenica</p>
      <div id="agendaDays" class="agenda-days" aria-live="polite"></div>
    </section>
  </main>

  <dialog class="turn-dialog" id="turnDialog" aria-labelledby="dialogTitle">
    <div class="dialog-shell">
      <header class="dialog-header">
        <div><p id="dialogGroup"></p><h2 id="dialogTitle">Dettaglio turno</h2></div>
        <button class="close-button" id="closeDialog" type="button" aria-label="Chiudi dettaglio">×</button>
      </header>
      <div id="dialogBody"></div>
    </div>
  </dialog>

  <dialog class="agenda-edit-dialog" id="agendaEditDialog" aria-labelledby="agendaEditTitle">
    <div class="agenda-edit-shell">
      <header class="agenda-edit-header">
        <div><p>Agenda personale</p><h2 id="agendaEditTitle">Modifica giornata</h2></div>
        <button class="agenda-edit-close" id="closeAgendaEdit" type="button" aria-label="Chiudi">×</button>
      </header>
      <div class="agenda-edit-body">
        <p class="agenda-edit-label">Ferie</p>
        <div class="agenda-status-options" role="group" aria-label="Stato ferie">
          <button type="button" data-agenda-status="requested">Chiedere ferie</button>
          <button type="button" data-agenda-status="approved">Ferie concesse</button>
          <button type="button" data-agenda-status="none">Nessuna ferie</button>
        </div>
        <label class="agenda-note-field" for="agendaNote">
          <span>Note</span>
          <textarea id="agendaNote" rows="4" placeholder="Scrivi qui quello che desideri…"></textarea>
        </label>
      </div>
      <footer class="agenda-edit-footer">
        <button class="agenda-clear-button" id="clearAgendaEdit" type="button">Azzera</button>
        <button class="agenda-save-button" id="saveAgendaEdit" type="button">Salva</button>
      </footer>
    </div>
  </dialog>

  <noscript><p class="loading-status loading-status--error">Per visualizzare il prospetto è necessario attivare JavaScript.</p></noscript>
  <script src="data.js?v=20260910-1"></script>
    <script src="app.js?v=20260910-4"></script>
</body>
</html>
