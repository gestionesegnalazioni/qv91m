name: Smooth Gestione Bus initial load

on:
  push:
    paths:
      - '.github/workflows/smooth-initial-load.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loading and cache behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Non cancellare più la cache ad ogni apertura.
          s = s.replace("['cache_buses','cache_seg','cache_temi'].forEach(key => localStorage.removeItem(key));", "// Mantieni la cache locale per un'apertura immediata dell'app.", 1)

          # 2) Carica subito la cache dopo le dichiarazioni principali.
          marker = """let attentionReportEntries = [];
let selectedBus = null;"""
          replacement = """let attentionReportEntries = [];

// Mostra subito l'ultimo stato noto mentre Firestore aggiorna i dati in background.
try {
  buses = JSON.parse(localStorage.getItem('cache_buses') || '[]');
  segnalazioni = JSON.parse(localStorage.getItem('cache_seg') || '[]');
  temi = JSON.parse(localStorage.getItem('cache_temi') || '[]');
  fermateSoppresse = JSON.parse(localStorage.getItem('cache_fermate') || '[]');
  modifiche = JSON.parse(localStorage.getItem('cache_modifiche') || '[]');
  attentionReportEntries = JSON.parse(localStorage.getItem('cache_report') || '[]');
} catch (_) {}

let selectedBus = null;"""
          if marker not in s:
              raise SystemExit('Marker dichiarazioni non trovato')
          s = s.replace(marker, replacement, 1)

          # 3) Salva gli snapshot aggiornati nella cache.
          replacements = [
            ("buses = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort(byMat);",
             "buses = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort(byMat);\n    localStorage.setItem('cache_buses', JSON.stringify(buses));"),
            ("segnalazioni = snap.docs.map(d => ({ id:d.id, ...d.data() }));",
             "segnalazioni = snap.docs.map(d => ({ id:d.id, ...d.data() }));\n    localStorage.setItem('cache_seg', JSON.stringify(segnalazioni));"),
            ("fermateSoppresse = snap.docs.map(d => ({ id:d.id, ...d.data() }))",
             "fermateSoppresse = snap.docs.map(d => ({ id:d.id, ...d.data() }))"),
            ("modifiche = snap.docs.map(d => ({ id:d.id, ...d.data() }));",
             "modifiche = snap.docs.map(d => ({ id:d.id, ...d.data() }));\n    localStorage.setItem('cache_modifiche', JSON.stringify(modifiche));"),
            ("attentionReportEntries = snap.docs.map(d => ({ id:d.id, ...d.data() }))",
             "attentionReportEntries = snap.docs.map(d => ({ id:d.id, ...d.data() }))"),
            ("temi = snap.docs.map(d => ({ id:d.id, ...d.data() }))",
             "temi = snap.docs.map(d => ({ id:d.id, ...d.data() }))"),
          ]
          for old, new in replacements:
              if old in s and old != new:
                  s = s.replace(old, new, 1)

          # Inserisci salvataggi per collezioni che hanno .sort() su righe successive.
          s = s.replace(".sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));\n    renderBusGrid();\n    renderStops();",
                        ".sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));\n    localStorage.setItem('cache_fermate', JSON.stringify(fermateSoppresse));\n    renderBusGrid();\n    renderStops();", 1)
          s = s.replace("});\n    renderAttentionReport();\n  }, err => {\n    console.error('Report autobus non disponibile'",
                        "});\n    localStorage.setItem('cache_report', JSON.stringify(attentionReportEntries));\n    renderAttentionReport();\n  }, err => {\n    console.error('Report autobus non disponibile'", 1)
          s = s.replace(".sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));\n    renderBusGrid();\n    renderTopics();",
                        ".sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));\n    localStorage.setItem('cache_temi', JSON.stringify(temi));\n    renderBusGrid();\n    renderTopics();", 1)

          # 4) Accesso diretto: mostra immediatamente l'app usando la cache, poi aggiorna in background.
          old = """} else {
  const gate = document.getElementById('authGate');
  const shell = document.getElementById('appShell');
  gate.classList.add('hidden');
  // Mantieni l'app nascosta finché autobus e segnalazioni non sono arrivati.
  shell.setAttribute('aria-hidden', 'true');
  resetProtectedViews();
  startDataSubscriptions();
}"""
          new = """} else {
  const gate = document.getElementById('authGate');
  const shell = document.getElementById('appShell');
  gate.classList.add('hidden');
  shell.setAttribute('aria-hidden', 'false');
  resetProtectedViews();
  startDataSubscriptions();
}"""
          if old not in s:
              raise SystemExit('Blocco accesso diretto 9.69 non trovato')
          s = s.replace(old, new, 1)

          # Se non c'è ancora cache, evita comunque i falsi "0 autobus" mostrando un caricamento neutro.
          target = """function renderCategoryView() {"""
          if target in s:
              s = s.replace(target, """function renderCategoryView() {
  if (!initialDataReady.buses && !buses.length) {
    const list = document.getElementById('categoryBusList');
    if (list) list.innerHTML = '<div class=\"loading\">Caricamento autobus…</div>';
    return;
  }""", 1)

          s = s.replace('content="9.69"', 'content="9.70"', 1)
          s = s.replace('<title>Gestione Bus v9.69</title>', '<title>Gestione Bus v9.70</title>', 1)
          s = s.replace('// Accesso diretto attivo (v9.69).', '// Accesso diretto attivo (v9.70).', 1)
          p.write_text(s, encoding='utf-8')
          Path('version.txt').write_text('9.70\n', encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "gestionesegnalazioni"
          git config user.email "antonio.mauceri82@gmail.com"
          git add index.html version.txt
          git commit -m "Make initial Gestione Bus load immediate" || exit 0
          git push
